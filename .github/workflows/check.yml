name: Flutter checks
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.*'
      - '.ci/prepare_project.py'
      - '.ci/test_prepare_project.py'
      - '.ci/brand_assets.py'
      - '.github/workflows/check.yml'
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        id: format
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - name: Analyze
        if: success() || failure()
        run: flutter analyze --fatal-infos
      - name: Test
        if: success() || failure()
        run: flutter test --timeout=90s
      - name: Native project configuration
        if: success() || failure()
        run: python3 -m unittest discover -s .ci -p 'test_*.py'
      - name: Dependency lock and formatting patch
        if: always()
        run: |
          git diff -- pubspec.lock lib test > validation.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-patch
          path: validation.patch
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare native project
        run: python3 .ci/prepare_project.py
      - name: Android debug build
        run: flutter build apk --debug
