name: iPhone UI preview
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: iphone-parity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-iphone:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode with iOS 26 SDK
        run: python3 .ci/parity_ios.py select-xcode
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare native project
        run: python3 .ci/prepare_project.py
      - name: Build real iPhone simulator app
        run: |
          set -euo pipefail
          mkdir -p artifacts/iphone-parity
          # Preview-only architecture; production/TestFlight settings are untouched.
          cat > "$RUNNER_TEMP/giristair-preview.xcconfig" <<'PREVIEW_CONFIG'
          ARCHS = x86_64
          ONLY_ACTIVE_ARCH = YES
          PREVIEW_CONFIG
          export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/giristair-preview.xcconfig"
          flutter build ios --simulator --debug --config-only \
            --target=tool/parity_preview.dart --dart-define=PARITY_TAB=0
          # The mixed SPM/Pods build graph omits the aggregate framework target.
          # Build it explicitly in the same output directory before linking Runner.
          if ! xcrun xcodebuild -project ios/Pods/Pods.xcodeproj -target Pods-Runner \
            -configuration Debug -sdk iphonesimulator \
            BUILD_DIR="$PWD/build/ios" SYMROOT="$PWD/build/ios" \
            CODE_SIGNING_ALLOWED=NO build > artifacts/iphone-parity/pods-build.log 2>&1; then
            tail -n 160 artifacts/iphone-parity/pods-build.log
            exit 1
          fi
          tail -n 12 artifacts/iphone-parity/pods-build.log
          if ! flutter build ios --simulator --debug --verbose \
            --target=tool/parity_preview.dart \
            --dart-define=PARITY_TAB=0 > artifacts/iphone-parity/build.log 2>&1; then
            tail -n 160 artifacts/iphone-parity/build.log
            exit 1
          fi
          tail -n 12 artifacts/iphone-parity/build.log
      - name: Archive the built simulator app for independent capture retries
        run: ditto -c -k --keepParent build/ios/iphonesimulator/Runner.app artifacts/Runner.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: iphone-simulator-app
          path: artifacts/Runner.app.zip
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-build-logs
          path: artifacts/iphone-parity
          overwrite: true
          if-no-files-found: warn
  iphone-preview:
    needs: build-iphone
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode with iOS 26 SDK
        run: python3 .ci/parity_ios.py select-xcode
      - uses: actions/download-artifact@v4
        with:
          name: iphone-simulator-app
          path: artifacts/built-app
      - name: Extract the actual compiled app
        run: |
          mkdir -p "$RUNNER_TEMP/giristair-preview"
          ditto -x -k artifacts/built-app/Runner.app.zip "$RUNNER_TEMP/giristair-preview"
      - name: Capture the five rendered Japanese iPhone screens
        run: |
          set -euo pipefail
          mkdir -p artifacts/iphone-parity
          python3 -u .ci/parity_ios.py capture \
            --app "$RUNNER_TEMP/giristair-preview/Runner.app" \
            --output artifacts/iphone-parity 2>&1 | tee artifacts/iphone-parity/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-parity
          path: artifacts/iphone-parity
          overwrite: true
          if-no-files-found: warn
