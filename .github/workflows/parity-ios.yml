name: iPhone UI preview
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: iphone-parity-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  iphone-preview:
    runs-on: macos-15-intel
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode with iOS 26 SDK
        run: python3 .ci/parity_ios.py select-xcode
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Prepare native project
        run: python3 .ci/prepare_project.py
      - name: Build real iPhone simulator app
        run: |
          set -o pipefail
          mkdir -p artifacts/iphone-parity
          flutter build ios --simulator --debug --verbose \
            --target=tool/parity_preview.dart \
            --dart-define=PARITY_TAB=0 2>&1 | tee artifacts/iphone-parity/build.log
      - name: Capture Japanese iPhone registration screen
        run: >-
          python3 .ci/parity_ios.py capture
          --app build/ios/iphonesimulator/Runner.app
          --output artifacts/iphone-parity
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-parity
          path: artifacts/iphone-parity
          if-no-files-found: warn
