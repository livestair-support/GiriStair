name: giristair
description: 生大喜利とネット大喜利の予定、戦績、思考を残すプレイヤーの記録帳。
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  google_mlkit_text_recognition: ^0.15.1
  share_plus: ^12.0.1
  file_selector: ^1.0.4
  package_info_plus: ^9.0.0
  cross_file: ^0.3.5+1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
